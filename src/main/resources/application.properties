spring.application.name=spring-boot-jpa-postgresql

# log
# debug=true
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.hibernate.SQL=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.postgresql=DEBUG

# Specify the DataSource implementation class
# HikariCP (default, fast, lightweight, and stable)
#spring.datasource.type=com.zaxxer.hikari.HikariDataSource
# Tomcat JDBC Pool
#spring.datasource.type=org.apache.tomcat.jdbc.pool.DataSource
# Apache DBCP2
#spring.datasource.type=org.apache.commons.dbcp2.BasicDataSource

# DB connection settings
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
#spring.datasource.username=postgres
#spring.datasource.password=postgres
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/mariadb
spring.datasource.username=root
spring.datasource.password=qwer1234

spring.datasource.hikari.auto-commit: false
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

spring.jpa.defer-datasource-initialization=true

# none,create,create-drop,update,validate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.fetch_size=1000
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.security.user.name=user
spring.security.user.password=qwer1234

# spring_session, spring_session_attributes CREATE
# always, embedded,never 
# embedded : (H2, HSQL, Derby) when only use / dev/test
# Always initialize the schema / TEST
spring.session.jdbc.initialize-schema=always
# Initialize only when using an embedded database / DEV
#spring.session.jdbc.initialize-schema=embedded
# Never initialize / REAL
#spring.session.jdbc.initialize-schema=never

# none, jdbc, redis, hazelcast, mongodb
# 'spring.session.store-type' is an unknown property. Did you mean 'spring.session.servlet.filter-order'? [PROP_UNKNOWN_PROPERTY]
#spring.session.store-type=jdbc

# data.sql Excute
# never,always,embedded
spring.sql.init.mode=embedded

# Disable cache during development
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# server port number
#server.port=8081
