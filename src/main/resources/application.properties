spring.application.name=spring-boot-jpa-postgresql

# DB connection settings
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.hikari.auto-commit: false
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

spring.jpa.properties.hibernate.jdbc.fetch_size=1000
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# h2 database
#spring.h2.console.enabled=true
# anytime create. but this is fixed url
#spring.datasource.url=jdbc:h2:mem:demo

# none,create,update,validate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Query query = entityManager.createQuery("SELECT u FROM User u");
#query.setHint("org.hibernate.fetchSize", 500);
#List<User> users = query.getResultList();
#
#jdbcTemplate.setFetchSize(500);

spring.jpa.open-in-view=false

# data.sql Excute
#1. Let Spring Boot automatically create tables
# never,always,embedded
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.session.jdbc.initialize-schema=always
# spring.session.store-type=jdbc

#2. Creating a table manually
# Directly execute the SQL script provided by Spring Session JDBC
#: Path: org/springframework/session/jdbc/schema-postgresql.sql
# (in the spring-session-jdbc JAR)

# log
# debug=true
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.hibernate.SQL=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.postgresql=DEBUG

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Disable cache during development
spring.thymeleaf.cache=false

# server port number
#server.port=8081
