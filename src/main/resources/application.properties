spring.application.name=spring-boot-jpa-postgresql

# DB 연결 설정
spring.datasource.url=jdbc:postgresql://postgres.cxg2cwseemwh.ap-northeast-2.rds.amazonaws.com:5432/postgres
# example
# spring.datasource.url=jdbc:mysql://localhost:3306/website?characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=postgres
spring.datasource.password=yolo11ai
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# create: 애플리케이션 시작 시 테이블 생성. update: 기존 테이블을 유지하며 변경 사항만 반영. 
# validate: 테이블 구조를 검증만 함. none: 아무 작업도 하지 않음.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# jpa 설정
# 사용할 sql문 종류 설정 - 이 부분은 선택한 JPA 구현체와 DBMS의 종류에 따라 달라집니다.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
