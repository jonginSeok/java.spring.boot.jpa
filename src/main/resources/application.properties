spring.application.name=spring-boot-jpa-postgresql

# DB 연결 설정
spring.datasource.url=jdbc:postgresql://postgres.cxg2cwseemwh.ap-northeast-2.rds.amazonaws.com:5432/postgres
# example
# spring.datasource.url=jdbc:mysql://localhost:3306/website?characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=postgres
spring.datasource.password=yolo11ai
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# create: 애플리케이션 시작 시 테이블 생성. update: 기존 테이블을 유지하며 변경 사항만 반영. 
# validate: 테이블 구조를 검증만 함. none: 아무 작업도 하지 않음.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Spring Boot에서 자동 생성하게 설정
# embedded	내장 DB(H2, HSQL, Derby 등)일 때만 테이블 생성	로컬 테스트나 단발성 실험
# always	DB 종류 상관없이 매번 앱 시작 시 테이블 생성	개발 환경에서 빠르게 세팅할 때
# never	자동 생성 안 함 (수동 생성 필요)	운영 환경, 이미 테이블이 있는 경우
spring.session.jdbc.initialize-schema=never


# jpa 설정
# 사용할 sql문 종류 설정 - 이 부분은 선택한 JPA 구현체와 DBMS의 종류에 따라 달라집니다.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
