<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<title>페이지 액션 리스트</title>
</head>
<body>
	<h1>리스트</h1>
	<!-- <a th:href="{/PageAction/new}">새로 작성</a> -->
	<ul>
		<li th:each="pageAction : ${PageActions}">
			<span th:text="${pageAction.id}" ></span>
			<span th:text="${pageAction.actionKey}" ></span>
			<span th:text="${pageAction.description}" ></span>
			<span th:text="${pageAction.page}" ></span>
		</li>
		<li th:unless="${PageActions}">데이터가 없습니다.</li>
	</ul>
</body>
</html>
